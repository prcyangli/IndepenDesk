name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (x64, x86, arm64 — self-contained)
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($arch in "x64","x86","arm64") {
            dotnet publish -c Release -r win-$arch --self-contained true `
              /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true `
              /p:Version=$version -o publish\$arch
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Compress-Archive -Path publish\$arch\IndepenDesk.exe `
              -DestinationPath "artifacts\IndepenDesk-$env:GITHUB_REF_NAME-win-$arch.zip"
          }

      - name: Build installers (Inno Setup)
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          foreach ($arch in "x64","x86","arm64") {
            & $iscc packaging\installer.iss /DArch=$arch /DMyVersion=$version /Oartifacts
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Build MSI packages (WiX)
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          foreach ($arch in "x64","x86","arm64") {
            wix build packaging\Product.wxs -arch $arch -pdbtype none `
              -ext WixToolset.UI.wixext/5.0.2 `
              -d MyVersion=$version `
              -d ExePath=publish\$arch\IndepenDesk.exe `
              -d IconPath=packaging\app.ico `
              -d LicenseRtf=packaging\License.rtf `
              -o "artifacts\IndepenDesk-$version-$arch.msi"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
