name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          dotnet publish -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true /p:Version=$version -o publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\IndepenDesk.exe -DestinationPath "IndepenDesk-$env:GITHUB_REF_NAME-win-x64.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            IndepenDesk-*.zip
            publish/IndepenDesk.exe
          generate_release_notes: true
